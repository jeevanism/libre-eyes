services:
  - type: web
    name: visionopus-demo
    runtime: docker
    region: frankfurt
    branch: visionopus
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    numInstances: 1
    healthCheckPath: /health/live
    envVars:
      - key: VISIONOPUS_ENV
        value: development
      - key: VISIONOPUS_HTTP_ADDR
        value: :10000
      - key: VISIONOPUS_STATIC_DIR
        value: /app/web
      - key: VISIONOPUS_COOKIE_SECURE
        value: "true"
      - key: VISIONOPUS_DATABASE_URL
        fromDatabase:
          name: visionopus-demo-db
          property: connectionString
      - key: VISIONOPUS_CSRF_KEY
        sync: false

databases:
  - name: visionopus-demo-db
    region: frankfurt
    plan: free
    databaseName: visionopus
    user: visionopus
