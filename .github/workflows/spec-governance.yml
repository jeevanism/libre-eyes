name: Specification Governance

on:
  pull_request:
  push:
    branches:
      - visionopus

permissions:
  contents: read

concurrency:
  group: spec-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate slice specifications
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Show Ruby version
        run: ruby --version

      - name: Test specification validator
        run: ruby -Itest test/spec_validator_test.rb

      - name: Validate slice specifications
        run: ./scripts/validate-slices
